name: ContinuousIntegration

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install
        working-directory: EchoLogz/frontend-react

      - name: Run frontend tests
        run: npm test
        working-directory: EchoLogz/frontend-react

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: frontend-tests

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r EchoLogz/requirements.txt

      - name: Run backend tests
        run: |
          cd EchoLogz
          PYTHONPATH=. pytest tests
