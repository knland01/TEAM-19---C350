<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Sign in - EchoLogz</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="pw-style.css"/>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Don't use this in production: -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="js/utils.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" src="js/navbar.jsx"></script>
    <script type="text/babel">
      const {useState} = React;

      function SignInPage() {
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');
        const [loading, setLoading] = useState(false);
        const [errors, setErrors] = useState({});

        function handleSignIn() {
          setErrors({});
          const newErrors = {};

          if (!email) newErrors.email = 'Email is required';
          else if (!validateEmail(email)) newErrors.email = 'Please enter a valid email address';

          if (!password) newErrors.password = 'Password is required';
          else if (!validatePassword(password)) newErrors.password = 'Password must be at least 8 characters';
          if (Object.keys(newErrors).length > 0) {
            setErrors(newErrors);
            return;
          }

          setLoading(true);
          // Simulate API call
          setTimeout(() => {
            setLoading(false);
            window.location.href = 'index.html';
          }, 1200);
        }

        return (
          <div className="app-container">
            <Navbar />
            <div className="reset-container">
              <div className="reset-panel panel">
                <div className="reset-form">
                  <h2>Sign In to Your Account</h2>

                  <div className="form-group">
                    <label htmlFor="email">Email Address</label>
                    <input
                      id="email"
                      type="email"
                      value={email}
                      onChange={e => setEmail(e.target.value)}
                      placeholder="Enter your email address"
                      className={errors.email ? 'error' : ''}
                    />
                    {errors.email && <div className="error-message">{errors.email}</div>}
                  </div>

                  <div className="form-group">
                    <label htmlFor="password">Password</label>
                    <input
                      id="password"
                      type="password"
                      value={password}
                      onChange={e => setPassword(e.target.value)}
                      placeholder="Enter your password"
                      className={errors.password ? 'error' : ''}
                    />
                    {errors.password && <div className="error-message">{errors.password}</div>}
                  </div>

                  <button
                    className="btn primary full-width"
                    onClick={handleSignIn}
                    disabled={loading}
                  >
                    {loading ? 'Signing In...' : 'Sign In'}
                  </button>

                  <div style={{marginTop: '16px', textAlign: 'center'}}>
                    <a href="password-reset.html" className="muted small">Forgot your password?</a>
                  </div>

                  <div style={{marginTop: '8px', textAlign: 'center'}}>
                    <a href="sign_up.html" className="small">Sign Up</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<SignInPage />);
    </script>
  </body>
</html>
